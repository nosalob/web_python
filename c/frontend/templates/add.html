<!doctype html>
<html lang="vi">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Viết lời nhắn · Sổ lưu bút</title>
</head>

<body>
  <main class="shell">
    <header>
      <p class="eyebrow">GUESTBOOK · LỜI NHẮN TỪ BẠN</p>
      <h1>Viết lời nhắn</h1>
      <p class="intro">Chia sẻ vài dòng với mọi người.</p>
    </header>
    <section class="panel">{% if error %}<p class="notice error">{{ error }}</p>{% endif %}<form
        action="{{ url_for('guestbook.add') }}" method="post"><label for="name">Tên của bạn</label><input id="name"
          name="name" value="{{ name|default('') }}" placeholder="Ví dụ: Linh"><label for="message">Lời
          nhắn</label><textarea id="message" name="message" rows="4"
          placeholder="Bạn muốn chia sẻ điều gì?">{{ message|default('') }}</textarea><button type="submit">Gửi lời nhắn
          <span>↗</span></button></form>
    </section>
    <p><a class="text-link" href="{{ url_for('guestbook.index') }}">← Trở về sổ lưu bút</a></p>
  </main>
</body>

</html>
